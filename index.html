<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Academic Promotion</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f9;font-family:system-ui,"PingFang SC",sans-serif;color:#23334e}main{max-width:490px;margin:auto;padding:12px}h1{text-align:center;font-size:25px;margin:8px}p{text-align:center;margin:5px 0 12px;font-size:13px;color:#52627c}.stats{display:flex;gap:8px;margin-bottom:9px}.stats div{flex:1;background:white;border-radius:12px;padding:9px;text-align:center;font-size:13px}.stats b{display:block;font-size:22px}canvas{width:100%;display:block;background:linear-gradient(#f8fbff,#dbe6f5);border:3px solid #91a6c2;border-radius:14px;touch-action:none}button{background:#294e93;color:white;border:0;border-radius:9px;padding:11px 17px;font-size:15px}.controls{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:10px 0;flex-wrap:wrap}.controls button{padding:9px;font-size:12px}button:disabled{opacity:.45}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}.legend span{background:white;padding:6px;border-radius:7px;text-align:center} .modebar{display:flex;gap:5px;margin:8px 0}.modebar button{flex:1;padding:9px 2px;font-size:12px;background:#d9e4f3;color:#243e65}.modebar button.active{background:#294e93;color:white}.reward{background:#fff5d7;border:1px solid #e5c878;border-radius:9px;padding:9px;margin:8px 0;font-size:13px;min-height:36px}.goal{font-size:12px;color:#52627c;text-align:center;margin:5px}  .economy{background:#fff;border-radius:10px;padding:10px;margin:8px 0;font-size:13px}.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}.skills button{font-size:12px;padding:9px 3px;background:#385e9e}.skills button:disabled{opacity:.45}.hint{font-size:12px;color:#52627c;margin:5px 0;text-align:center} </style></head><body><main><h1>Academic Promotion</h1><p>学术晋升 · 相同等级碰撞合成更高等级</p><div class="stats"><div>分数<b id="score">0</b></div><div>最高分<b id="best">0</b></div></div><div class="modebar" id="modebar"></div><div class="goal" id="goal"></div><div class="goal" id="challenge"></div><div class="reward" id="reward" aria-live="polite">选择难度，合成目标等级并达到目标积分可领取奖励。</div><div class="economy">科研经费：<b id="funds">0</b>　发表论文进度：<b id="paperProgress">0/8</b>　技能次数：<b id="skillCredits">0</b></div><div class="skills" id="skills"></div><div class="hint" id="skillHint">合成获取经费，完成8次合成可发表论文。</div><canvas id="game" width="440" height="496"></canvas><div class="controls"><span id="status">移动手指选择位置，点击投放</span><button id="power" disabled>清除低级球 ×0</button><button id="restart">重新开始</button></div></main><script>
(()=>{const names=["本科生","硕士生","博士生","博士后","讲师","副教授","教授","优青","杰青","长江学者","院士"],colors=["#83c5f7","#65b8de","#66c4b2","#88bd7b","#d6b658","#e9a65d","#e68c69","#dc7796","#b47fc9","#867fc9","#d5a842"],symbols=["书","研","博","科","讲","副","教","优","杰","长","院"],radii=[24,29,34,40,46,53,60,68,77,87,98],W=440,H=496,canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),nextEl={set textContent(value){}},status=document.getElementById("status");const modes=[{name:"初级",width:440,weights:[25,30,25,20],time:5,target:5,points:40,dropSeconds:0,reward:"学术新星徽章"},{name:"普通",width:400,weights:[45,35,15,5],time:4,target:6,points:100,dropSeconds:20,reward:"青年学者徽章"},{name:"中级",width:360,weights:[65,30,5,0],time:3,target:7,points:180,dropSeconds:12,reward:"科研精英徽章"},{name:"高级",width:320,weights:[80,20,0,0],time:2,target:9,points:320,dropSeconds:8,reward:"学术领军徽章"},{name:"地狱",width:280,weights:[30,25,25,20],time:1,target:10,points:500,dropSeconds:5,reward:"院士之巅徽章"}];let modeIndex=1,highest=0,earned=false,overTime=0,overflowSince=0,noticeUntil=0,awardTimer=0,drops=0,deadline=0,credits=0,stage=0;const milestones=[3,5,7,9,10],powerEl=document.getElementById("power"),challengeEl=document.getElementById("challenge");let funds=0,mergeCount=0,paperReady=0,skillCredits=0,selectedSkill="",pauseUntil=0;const skillDefs=[["学术清理",50,1],["破格晋升",120,2],["科研暂停",40,1],["学术合作",100,2],["项目申请",30,1],["发表论文",0,0]];const skillsEl=document.getElementById("skills"),hintEl=document.getElementById("skillHint");function skillUI(){document.getElementById("funds").textContent=funds;document.getElementById("paperProgress").textContent=(mergeCount%8)+"/8"+(paperReady?"（可发表"+paperReady+"篇）":"");document.getElementById("skillCredits").textContent=skillCredits;skillsEl.innerHTML=skillDefs.map(([name,cost,units],i)=>"<button data-skill=\""+i+"\" "+(ended||(i===5?paperReady===0:funds<cost||skillCredits<units)?"disabled":"")+">"+name+"<small style=\"display:block\">"+(i===5?"奖励80经费":cost+"经费/"+units+"次")+"</small></button>").join("");hintEl.textContent=selectedSkill?"已选择"+selectedSkill+"：点击场内圆球使用":"每8次合成可发表论文；晋升考核获得技能次数。"}function paySkill(i){const d=skillDefs[i];if(ended||funds<d[1]||skillCredits<d[2])return false;funds-=d[1];skillCredits-=d[2];skillUI();return true}skillsEl.addEventListener("click",e=>{const btn=e.target.closest("button[data-skill]");if(!btn||ended)return;const i=Number(btn.dataset.skill);if(i===5){if(paperReady){paperReady--;funds+=80;showNotice("论文发表成功！获得80科研经费");skillUI()}return}if(i===1){selectedSkill="破格晋升";skillUI();return}if(i===0){if(!balls.length)return;const min=Math.min(...balls.map(b=>b.level)),target=balls.filter(b=>b.level===min).sort((a,b)=>a.y-b.y)[0];if(paySkill(i)){balls.splice(balls.indexOf(target),1);showNotice("学术清理完成")}return}if(i===2){if(modes[modeIndex].dropSeconds===0)return;if(paySkill(i)){pauseUntil=Math.max(performance.now(),pauseUntil)+10000;deadline+=10000;showNotice("科研暂停：自动投放延后10秒")}return}if(i===3){const pair=balls.find((a,j)=>a.level<10&&balls.some((b,k)=>k!==j&&b.level===a.level));if(!pair)return;const other=balls.find(b=>b!==pair&&b.level===pair.level);if(paySkill(i)){merge(pair,other);showNotice("学术合作：成功合成")}return}if(i===4&&paySkill(i)){next=rnd();nextEl.textContent=names[next];showNotice("项目申请：已刷新下一球")}});const goalEl=document.getElementById("goal"),rewardEl=document.getElementById("reward"),modebar=document.getElementById("modebar");function hideNotice(){noticeUntil=0;awardTimer=0;rewardEl.textContent="";rewardEl.style.display="none"}function showNotice(message){rewardEl.textContent=message;rewardEl.style.display="block";noticeUntil=performance.now()+3000;awardTimer=180}let balls=[],score=0,best=Number(localStorage.getItem("academicPromotionBest")||0),next=0,aim=W/2,ended=false,last=0,lock=0;bestEl.textContent=best;const rnd=()=>{let p=Math.random()*100;const w=modes[modeIndex].weights;for(let i=0;i<w.length;i++){p-=w[i];if(p<0)return i}return 0};function bounds(){const half=modes[modeIndex].width/2;return [W/2-half,W/2+half]}function updateMode(){const m=modes[modeIndex];goalEl.textContent="目标："+names[m.target]+" ＋ "+m.points+"分｜"+(modeIndex===0?"不限时投放｜警戒线5秒失败":"警戒线"+m.time+"秒失败");modebar.innerHTML=modes.map((v,i)=>"<button data-mode=\""+i+"\" class=\""+(i===modeIndex?"active":"")+"\">"+v.name+"</button>").join("");hideNotice();updateChallenge();skillUI()}function updateChallenge(){const t=modeIndex>=3?milestones[Math.min(stage,milestones.length-1)]:modes[modeIndex].target;challengeEl.textContent=(modeIndex>=3?"晋升考核 "+(stage+1)+"/5：合成"+names[t]+"（按顺序）｜":"")+(modeIndex===0?"初级：不限时投放":"晋升考核进行中");powerEl.textContent="清除低级球 ×"+credits;powerEl.disabled=credits<1||ended}modebar.addEventListener("click",e=>{const b=e.target.closest("button[data-mode]");if(!b)return;modeIndex=Number(b.dataset.mode);reset();updateMode()});updateMode();next=rnd();nextEl.textContent=names[next];function add(){if(ended||lock>0)return;const r=radii[next],[left,right]=bounds(),center=aim,x=Math.max(left+r+4,Math.min(right-r-4,center));balls.push({x,y:r+6,vx:0,vy:3,r,level:next,id:Math.random(),born:performance.now()});drops++;deadline=performance.now()+(modes[modeIndex].dropSeconds||1e12)*1000;next=rnd();nextEl.textContent=names[next];lock=.08}function reset(){hideNotice();balls=[];score=0;ended=false;lock=0;highest=0;earned=false;overTime=0;overflowSince=0;awardTimer=0;drops=0;stage=0;credits=0;funds=0;mergeCount=0;paperReady=0;skillCredits=0;selectedSkill="";pauseUntil=0;deadline=performance.now()+(modes[modeIndex].dropSeconds||1e12)*1000;next=rnd();scoreEl.textContent=0;nextEl.textContent=names[next];status.textContent="移动手指选择位置，点击投放";updateChallenge();hideNotice();skillUI()}document.getElementById("restart").onclick=reset;powerEl.onclick=()=>{if(credits<1||ended||!balls.length)return;const lv=Math.min(...balls.map(b=>b.level));const targets=balls.filter(b=>b.level===lv);if(!targets.length)return;targets.sort((a,b)=>a.y-b.y);balls.splice(balls.indexOf(targets[0]),1);credits--;updateChallenge()};function pointer(e){const box=canvas.getBoundingClientRect();aim=(e.clientX-box.left)*W/box.width}canvas.addEventListener("pointermove",pointer);canvas.addEventListener("pointerdown",e=>{pointer(e);if(selectedSkill==="破格晋升"){const box=canvas.getBoundingClientRect(),x=(e.clientX-box.left)*W/box.width,y=(e.clientY-box.top)*H/box.height;const target=balls.slice().reverse().find(b=>b.level<10&&Math.hypot(b.x-x,b.y-y)<=b.r);selectedSkill="";if(target&&paySkill(1)){target.level++;target.r=radii[target.level];highest=Math.max(highest,target.level);showNotice("破格晋升成功")}skillUI();return}add()});function merge(a,b){const lv=a.level;if(lv>=10)return false;const nr=radii[lv+1];a.x=Math.max(nr,Math.min(W-nr,(a.x+b.x)/2));a.y=Math.max(nr,Math.min(H-nr,(a.y+b.y)/2));a.level++;a.r=nr;highest=Math.max(highest,a.level);if(modeIndex>=3&&stage<milestones.length&&a.level>=milestones[stage]){stage++;credits++;skillCredits+=2;funds+=100;showNotice("晋升考核通过！获得一次清除低级球机会");updateChallenge()}else if(modeIndex<=2&&a.level>=modes[modeIndex].target&&credits===0){credits=1;skillCredits+=2;funds+=100;updateChallenge()}a.vx=(a.vx+b.vx)*.2;a.vy=-2;balls.splice(balls.indexOf(b),1);score+=lv+2;funds+=5;mergeCount++;if(mergeCount%8===0)paperReady++;skillUI();scoreEl.textContent=score;if(!earned&&highest>=modes[modeIndex].target&&score>=modes[modeIndex].points&&(modeIndex<3||stage===5)){earned=true;const m=modes[modeIndex];showNotice("恭喜！已获得「"+m.reward+"」！");try{localStorage.setItem("academicPromotionAward"+modeIndex,"1")}catch(e){}awardTimer=180}if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("academicPromotionBest",best)}return true}function physics(dt){const steps=3;for(let s=0;s<steps;s++){for(const b of balls){b.vy+=.65*dt;b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;b.vx*=.994;b.vy*=.999;const [left,right]=bounds();if(b.x<left+b.r){b.x=left+b.r;b.vx=Math.abs(b.vx)*.35}if(b.x>right-b.r){b.x=right-b.r;b.vx=-Math.abs(b.vx)*.35}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.2;b.vx*=.96}}let merged=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(dist>=min)continue;if(a.level===b.level&&merge(a,b)){merged=true;break outer}const nx=dx/dist,ny=dy/dist,overlap=min-dist,weight=a.r*a.r+b.r*b.r;a.x-=nx*overlap*b.r*b.r/weight;b.x+=nx*overlap*a.r*a.r/weight;a.y-=ny*overlap*b.r*b.r/weight;b.y+=ny*overlap*a.r*a.r/weight;const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){const impulse=-relative*.35;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}if(merged)continue}}function drawBall(b){const {x,y,r,level}=b;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=colors[level];ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle="#ffffff";ctx.stroke();ctx.beginPath();ctx.arc(x-r*.22,y-r*.26,r*.56,Math.PI,Math.PI*1.65);ctx.strokeStyle="#ffffff66";ctx.lineWidth=5;ctx.stroke();ctx.fillStyle="#20334c";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold "+Math.max(13,Math.min(27,r*.65))+"px sans-serif";ctx.fillText(symbols[level],x,y-r*.18);ctx.font="bold "+Math.max(9,Math.min(16,r*.34))+"px sans-serif";ctx.fillText(names[level],x,y+r*.42);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const [left,right]=bounds();ctx.fillStyle="#eaf0f9";ctx.fillRect(0,0,left,H);ctx.fillRect(right,0,W-right,H);ctx.strokeStyle="#91a6c2";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left,0);ctx.lineTo(left,H);ctx.moveTo(right,0);ctx.lineTo(right,H);ctx.stroke();ctx.strokeStyle="#c36c6c";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(0,95);ctx.lineTo(W,95);ctx.stroke();ctx.setLineDash([]);for(const b of balls)drawBall(b);if(!ended){ctx.globalAlpha=.6;drawBall({x:Math.max(left+radii[next],Math.min(right-radii[next],aim)),y:radii[next]+5,r:radii[next],level:next});ctx.globalAlpha=1}if(!ended&&overTime>0){ctx.textAlign="center";ctx.fillStyle="#b52235";ctx.font="bold 19px sans-serif";ctx.fillText("超线！"+Math.max(0,(modes[modeIndex].time-overTime)).toFixed(1)+"秒后结束",W/2,140)}if(!ended&&modes[modeIndex].dropSeconds>0){ctx.textAlign="center";ctx.fillStyle="#9a3340";ctx.font="bold 15px sans-serif";ctx.fillText("自动投放倒计时 "+Math.max(0,Math.ceil((deadline-performance.now())/1000))+"秒",W/2,115)}if(ended){ctx.fillStyle="#1e2a42cc";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="white";ctx.font="bold 35px sans-serif";ctx.fillText("游戏结束",W/2,H/2);ctx.font="20px sans-serif";ctx.fillText("最终得分 "+score,W/2,H/2+42)}}function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;if(lock>0)lock-=dt/60;if(!ended){physics(dt);if(modes[modeIndex].dropSeconds>0&&t>=deadline&&lock<=0){add();status.textContent="超时已自动投放，可继续选择落点"}const occupied=balls.some(b=>t-(b.born||0)>700&&b.y>95&&b.y-b.r<95);if(occupied){if(!overflowSince)overflowSince=t;overTime=(t-overflowSince)/1000}else{overflowSince=0;overTime=0}if(overTime>=modes[modeIndex].time){ended=true;status.textContent="挑战结束，点击重新开始"}powerEl.disabled=credits<1||ended;if(ended)skillUI()}loop.previous=t;if(noticeUntil&&performance.now()>=noticeUntil)hideNotice();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>

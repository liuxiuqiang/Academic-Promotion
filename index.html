function merge(a,b){const lv=a.level;if(lv>=10)return false;const nr=radii[lv+1];a.x=Math.max(nr,Math.min(W-nr,(a.x+b.x)/2));a.y=Math.max(nr,Math.min(H-nr,(a.y+b.y)/2));a.level++;a.r=nr;highest=Math.max(highest,a.level);if(modeIndex>=3&&stage<milestones.length&&a.level>=milestones[stage]){stage++;credits++;funds+=30;score+=30;showNotice("晋升考核通过！获得30科研经费");updateChallenge()}else if(modeIndex<=2&&a.level>=modes[modeIndex].target&&credits===0){credits=1;funds+=30;score+=30;updateChallenge()}a.vx=(a.vx+b.vx)*.2;a.vy=-2;balls.splice(balls.indexOf(b),1);const gain=mergeReward(lv);score+=gain;funds+=gain;mergeCount++;sound("merge",lv);skillUI();scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem(bestKey(),best)}return true}function physics(dt){const steps=3,[left,right]=bounds();for(let s=0;s<steps;s++){for(const b of balls){b.vy+=.65*dt;b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;b.vx*=.994;b.vy*=.999;if(b.x<left+b.r){b.x=left+b.r;b.vx=Math.abs(b.vx)*.35}if(b.x>right-b.r){b.x=right-b.r;b.vx=-Math.abs(b.vx)*.35}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.2;b.vx*=.96;if(b===dropBall)dropContact=true}}let merged=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r,distSq=dx*dx+dy*dy;if(distSq>=min*min)continue;if(a===dropBall||b===dropBall)dropContact=true;const dist=Math.sqrt(distSq)||.001;if(a.level===b.level&&merge(a,b)){merged=true;break outer}const nx=dx/dist,ny=dy/dist,overlap=min-dist,weight=a.r*a.r+b.r*b.r;a.x-=nx*overlap*b.r*b.r/weight;b.x+=nx*overlap*a.r*a.r/weight;a.y-=ny*overlap*b.r*b.r/weight;b.y+=ny*overlap*a.r*a.r/weight;const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){const impulse=-relative*.35;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}if(merged)continue}}function drawBall(b){const {x,y,r,level}=b;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=colors[level];ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle="#ffffff";ctx.stroke();ctx.beginPath();ctx.arc(x-r*.22,y-r*.26,r*.56,Math.PI,Math.PI*1.65);ctx.strokeStyle="#ffffff66";ctx.lineWidth=5;ctx.stroke();ctx.fillStyle="#20334c";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold "+Math.max(13,Math.min(27,r*.65))+"px sans-serif";ctx.fillText(symbols[level],x,y-r*.18);ctx.font="bold "+Math.max(9,Math.min(16,r*.34))+"px sans-serif";ctx.fillText(names[level],x,y+r*.42);ctx.restore()}function startSettlement(t){
 ended=true;settling=true;selectedSkill="";relocationDrag=null;bubbleBonus=0;finalFundsBonus=0;popFX=null;finalAward=null;
 
 settlementQueue=balls.slice().sort((a,b)=>a.level-b.level);
 settlementNext=t+140;status.textContent="终局结算：剩余泡泡逐个折算分数";sound("end");skillUI()
}
function advanceSettlement(t){
 if(!settling||t<settlementNext)return;
 if(settlementQueue.length){
  const b=settlementQueue.shift(),idx=balls.indexOf(b);
  if(idx>=0){balls.splice(idx,1);const value=bubbleReward(b.level);score+=value;bubbleBonus+=value;popFX={x:b.x,y:b.y,value,at:t};scoreEl.textContent=score;status.textContent=names[b.level]+"泡泡 +"+value.toLocaleString()+"分"}
  settlementNext=t+125;
 }else{
  finalFundsBonus=funds;score+=funds;funds=0;settling=false;scoreEl.textContent=score;finalAward=awardForScore(score);
  if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("academicPromotionBest",best)}
  status.textContent=finalAward?"恭喜获得"+finalAward.name+"！":"最终分数"+score.toLocaleString()+"，科研奖励未达标";
  skillUI()
 }
}
function draw(){ctx.clearRect(0,0,W,H);const [left,right]=bounds();ctx.fillStyle="#eaf0f9";ctx.fillRect(0,0,left,H);ctx.fillRect(right,0,W-right,H);ctx.strokeStyle="#91a6c2";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left,0);ctx.lineTo(left,H);ctx.moveTo(right,0);ctx.lineTo(right,H);ctx.stroke();ctx.strokeStyle="#c36c6c";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(0,95);ctx.lineTo(W,95);ctx.stroke();ctx.setLineDash([]);if(performance.now()<collabErrorUntil){ctx.save();ctx.font="bold 17px sans-serif";ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillStyle="#c21f36";ctx.fillText("学术合作失败：缺少同等级圆球",W/2,91,W-16);ctx.restore()}for(const b of balls){drawBall(b);if(selectedSkill){const cost=selectedSkill==="清理"?(canClearBall(b)&&clearUsed<CLEAR_LIMIT?clearCost(b.level):null):selectedSkill==="破格晋升"?(promotionUsed<PROMOTION_LIMIT&&b.level<10?promotionCost(b.level):null):selectedSkill==="合作"?(collabUsed<COLLAB_LIMIT&&b.level<10?collabCost(b.level):null):moveCost(b.level);
 if(cost!==null){ctx.save();const bw=Math.min(b.r*1.9,100);ctx.fillStyle=funds>=cost?"rgba(18,35,62,.88)":"rgba(155,47,61,.90)";ctx.fillRect(b.x-bw/2,b.y-13,bw,26);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold "+Math.max(11,Math.min(16,b.r*.40))+"px sans-serif";ctx.fillText(cost+" 经费",b.x,b.y,bw-3);ctx.restore()}}}
 if(relocationDrag){ctx.save();ctx.globalAlpha=.55;const b=relocationDrag.ball;drawBall({x:relocationDrag.x,y:relocationDrag.y,r:b.r,level:b.level});ctx.restore()}
if(popFX&&performance.now()-popFX.at<300){const age=performance.now()-popFX.at;ctx.save();ctx.globalAlpha=1-age/300;ctx.strokeStyle="#f3aa38";ctx.lineWidth=5-age/140;ctx.beginPath();ctx.arc(popFX.x,popFX.y,12+age*.14,0,Math.PI*2);ctx.stroke();ctx.fillStyle="#b05e16";ctx.textAlign="center";ctx.font="bold 22px sans-serif";ctx.fillText("+"+popFX.value,popFX.x,popFX.y-16-age*.11);ctx.restore()}
if(!ended){ctx.globalAlpha=.6;drawBall({x:Math.max(left+radii[next],Math.min(right-radii[next],aim)),y:radii[next]+5,r:radii[next],level:next});ctx.globalAlpha=1}if(!ended&&overTime>0){ctx.textAlign="center";ctx.fillStyle="#b52235";ctx.font="bold 19px sans-serif";ctx.fillText("超线！"+Math.max(0,(modes[modeIndex].time-overTime)).toFixed(1)+"秒后结束",W/2,140)}if(!ended){ctx.textAlign="center";ctx.fillStyle="#9a3340";ctx.font="bold 15px sans-serif";ctx.fillText("自动投放倒计时 "+Math.max(0,Math.ceil((deadline-performance.now())/1000))+"秒",W/2,115);
 ctx.fillStyle=canDrop()?"#21744e":"#b05e16";ctx.font="bold 12px sans-serif";ctx.fillText(canDrop()?"可投放":"落球中",W-44,76,75)
}if(settling){ctx.fillStyle="#23334e";ctx.textAlign="center";ctx.font="bold 17px sans-serif";ctx.fillText("终局结算 · 点击画面可跳过",W/2,37)}if(ended&&!settling){ctx.fillStyle="#1e2a42cc";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="white";ctx.font="bold 35px sans-serif";ctx.fillText("游戏结束",W/2,H/2);ctx.font="20px sans-serif";ctx.fillText("最终得分 "+score,W/2,H/2+30);ctx.font="16px sans-serif";ctx.fillText("泡泡折算 +"+bubbleBonus+" 分",W/2,H/2+60);ctx.fillText("经费折算 +"+finalFundsBonus.toLocaleString()+" 分",W/2,H/2+88);if(finalAward){ctx.save();ctx.fillStyle="#fff3f1";ctx.fillRect(23,H/2+101,W-46,76);ctx.textAlign="center";ctx.fillStyle="#cf1934";ctx.font="bold 35px sans-serif";ctx.fillText("恭喜获得",W/2,H/2+128);ctx.fillStyle="#243759";ctx.font="bold 18px sans-serif";ctx.fillText(finalAward.name+"！",W/2,H/2+160,W-60);ctx.restore()}else{ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";ctx.fillText("科研成果奖励未达标",W/2,H/2+125,W-18)}ctx.save();ctx.fillStyle="#ffc95e";ctx.fillRect(W/2-103,H-55,206,43);ctx.fillStyle="#26334e";ctx.font="bold 20px sans-serif";ctx.textAlign="center";ctx.fillText("点击重新开始",W/2,H-27);ctx.restore()}}function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;if(!ended){physics(dt);if(modes[modeIndex].dropSeconds>0&&t>=deadline&&canDrop(t)){add(true)}const occupied=balls.some(b=>t-(b.born||0)>350&&b.y-b.r<95);if(occupied){if(!overflowSince)overflowSince=t;overTime=(t-overflowSince)/1000}else{overflowSince=0;overTime=0}if(overTime>=modes[modeIndex].time){startSettlement(t)}if(ended)skillUI()}if(settling)advanceSettlement(t);loop.previous=t;if(noticeUntil&&performance.now()>=noticeUntil)hideNotice();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script><script>window.addEventListener("error",function(e){var el=document.getElementById("skillHint");if(el)el.textContent="游戏脚本错误："+(e.message||"未知错误");});</script></body></html>

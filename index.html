<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Academic Promotion</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f9;font-family:system-ui,"PingFang SC",sans-serif;color:#23334e}main{max-width:490px;margin:auto;padding:12px}h1{text-align:center;font-size:25px;margin:8px}p{text-align:center;margin:5px 0 12px;font-size:13px;color:#52627c}.stats{display:flex;gap:8px;margin-bottom:9px}.stats div{flex:1;background:white;border-radius:12px;padding:9px;text-align:center;font-size:13px}.stats b{display:block;font-size:22px}canvas{width:100%;display:block;background:linear-gradient(#f8fbff,#dbe6f5);border:3px solid #91a6c2;border-radius:14px;touch-action:none}button{background:#294e93;color:white;border:0;border-radius:9px;padding:11px 17px;font-size:15px}.controls{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}.legend span{background:white;padding:6px;border-radius:7px;text-align:center}</style></head><body><main><h1>Academic Promotion</h1><p>学术晋升 · 相同等级碰撞合成更高等级</p><div class="stats"><div>分数<b id="score">0</b></div><div>最高分<b id="best">0</b></div><div>下一等级<b id="next">本科生</b></div></div><canvas id="game" width="440" height="620"></canvas><div class="controls"><span id="status">移动手指选择位置，点击投放</span><button id="restart">重新开始</button></div><div class="legend" id="legend"></div></main><script>
(()=>{const names=["本科生","硕士生","博士生","博士后","讲师","副教授","教授","优青","杰青","长江学者","院士"],colors=["#83c5f7","#65b8de","#66c4b2","#88bd7b","#d6b658","#e9a65d","#e68c69","#dc7796","#b47fc9","#867fc9","#d5a842"],symbols=["书","研","博","科","讲","副","教","优","杰","长","院"],radii=[19,24,29,34,40,46,53,60,68,77,87],W=440,H=620,canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),nextEl=document.getElementById("next"),status=document.getElementById("status");document.getElementById("legend").innerHTML=names.map((n,i)=>'<span>'+symbols[i]+' · '+n+'</span>').join('');let balls=[],score=0,best=Number(localStorage.getItem("academicPromotionBest")||0),next=0,aim=W/2,ended=false,last=0,lock=0;bestEl.textContent=best;const rnd=()=>Math.floor(Math.random()*4);next=rnd();nextEl.textContent=names[next];function add(){if(ended||lock>0)return;if(balls.length>=110){ended=true;status.textContent='游戏结束：圆球数量过多';return}const r=radii[next],x=Math.max(r+4,Math.min(W-r-4,aim));if(balls.some(b=>Math.hypot(b.x-x,b.y-(r+6))<b.r+r+3)){status.textContent="投放位置被挡住，请选择其他位置";return}balls.push({x,y:r+6,vx:0,vy:0,r,level:next,id:Math.random(),angle:0,omega:0});next=rnd();nextEl.textContent=names[next];lock=.12;status.textContent="移动手指选择位置，点击投放"}function reset(){balls=[];score=0;ended=false;lock=0;next=rnd();scoreEl.textContent=0;nextEl.textContent=names[next];status.textContent="移动手指选择位置，点击投放"}document.getElementById("restart").onclick=reset;function pointer(e){const box=canvas.getBoundingClientRect();aim=(e.clientX-box.left)*W/box.width}canvas.addEventListener("pointermove",pointer);canvas.addEventListener("pointerdown",e=>{pointer(e);add()});function merge(a,b){const lv=a.level;if(lv>=10)return false;const nr=radii[lv+1];a.x=Math.max(nr,Math.min(W-nr,(a.x+b.x)/2));a.y=Math.max(nr,Math.min(H-nr,(a.y+b.y)/2));a.level++;a.r=nr;a.vx=(a.vx+b.vx)*.2;a.vy=-2;a.omega=(a.omega+b.omega)*.3;a.angle=(a.angle+b.angle)/2;balls.splice(balls.indexOf(b),1);score+=2**(lv+1)*10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("academicPromotionBest",best)}return true}function physics(dt){const steps=3;dt=Math.min(1.25,Math.max(.25,dt));for(let s=0;s<steps;s++){for(const b of balls){b.vy+=.22*dt/3;b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;b.angle+=b.omega*dt/steps;b.vx*=.996;b.vy*=.996;b.omega*=.985;if(!Number.isFinite(b.x+b.y+b.vx+b.vy+b.angle+b.omega)){b.x=W/2;b.y=50;b.vx=0;b.vy=0;b.angle=0;b.omega=0}if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.3;b.omega+=b.vy*.004}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.3;b.omega-=b.vy*.004}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.24;const slip=b.vx+b.omega*b.r,fr=Math.max(-.12,Math.min(.12,slip*.12));b.vx-=fr;b.omega-=fr/b.r;b.vx*=.98;if(Math.abs(b.vy)<.12)b.vy=0}}let merged=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(dist>=min)continue;if(a.level===b.level&&merge(a,b)){merged=true;break outer}const nx=dx/dist,ny=dy/dist,overlap=min-dist,weight=a.r*a.r+b.r*b.r;a.x-=nx*overlap*b.r*b.r/weight;b.x+=nx*overlap*a.r*a.r/weight;a.y-=ny*overlap*b.r*b.r/weight;b.y+=ny*overlap*a.r*a.r/weight;const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){const ma=a.r*a.r,mb=b.r*b.r,impulse=Math.min(80,-1.16*relative/(1/ma+1/mb));a.vx-=impulse*nx/ma;a.vy-=impulse*ny/ma;b.vx+=impulse*nx/mb;b.vy+=impulse*ny/mb}const tangentX=-ny,tangentY=nx,slip=(b.vx-a.vx)*tangentX+(b.vy-a.vy)*tangentY-b.omega*b.r-a.omega*a.r,ma=a.r*a.r,mb=b.r*b.r,den=3/ma+3/mb,j=Math.max(-.35,Math.min(.35,-slip/den));a.vx-=j*tangentX/ma;a.vy-=j*tangentY/ma;b.vx+=j*tangentX/mb;b.vy+=j*tangentY/mb;a.omega-=2*j/(ma*a.r);b.omega-=2*j/(mb*b.r);a.omega=Math.max(-.12,Math.min(.12,a.omega));b.omega=Math.max(-.12,Math.min(.12,b.omega))}if(merged)continue}}function drawBall(b){const {x,y,r,level}=b;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=colors[level];ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle="#ffffff";ctx.stroke();ctx.beginPath();ctx.arc(x-r*.22,y-r*.26,r*.56,Math.PI,Math.PI*1.65);ctx.strokeStyle="#ffffff66";ctx.lineWidth=5;ctx.stroke();ctx.translate(x,y);ctx.rotate(b.angle||0);ctx.translate(-x,-y);ctx.fillStyle="#20334c";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold "+Math.max(13,Math.min(27,r*.65))+"px sans-serif";ctx.fillText(symbols[level],x,y-r*.18);ctx.font="bold "+Math.max(9,Math.min(16,r*.34))+"px sans-serif";ctx.fillText(names[level],x,y+r*.42);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.strokeStyle="#c36c6c";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(0,95);ctx.lineTo(W,95);ctx.stroke();ctx.setLineDash([]);for(const b of balls)drawBall(b);if(!ended){ctx.globalAlpha=.6;drawBall({x:Math.max(radii[next],Math.min(W-radii[next],aim)),y:radii[next]+5,r:radii[next],level:next});ctx.globalAlpha=1}if(ended){ctx.fillStyle="#1e2a42cc";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="white";ctx.font="bold 35px sans-serif";ctx.fillText("游戏结束",W/2,H/2);ctx.font="20px sans-serif";ctx.fillText("最终得分 "+score,W/2,H/2+42)}}function loop(t){let dt=Math.min(1.25,(t-last)/16.67||1);last=t;if(lock>0)lock-=dt/60;if(!ended)physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>

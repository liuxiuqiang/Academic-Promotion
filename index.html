<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Academic Promotion</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f9;font-family:system-ui,"PingFang SC",sans-serif;color:#23334e}main{max-width:490px;margin:auto;padding:12px}h1{text-align:center;font-size:25px;margin:8px}p{text-align:center;margin:5px 0 12px;font-size:13px;color:#52627c}.stats{display:flex;gap:8px;margin-bottom:9px}.stats div{flex:1;background:white;border-radius:12px;padding:9px;text-align:center;font-size:13px}.stats b{display:block;font-size:22px}canvas{width:100%;display:block;background:linear-gradient(#f8fbff,#dbe6f5);border:3px solid #91a6c2;border-radius:14px;touch-action:none}button{background:#294e93;color:white;border:0;border-radius:9px;padding:11px 17px;font-size:15px}.controls{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:10px 0;flex-wrap:wrap}.controls button{padding:9px;font-size:12px}button:disabled{opacity:.45}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}.legend span{background:white;padding:6px;border-radius:7px;text-align:center} .modebar{display:flex;gap:5px;margin:8px 0}.modebar button{flex:1;padding:9px 2px;font-size:12px;background:#d9e4f3;color:#243e65}.modebar button.active{background:#294e93;color:white}.reward{background:#fff5d7;border:1px solid #e5c878;border-radius:9px;padding:9px;margin:8px 0;font-size:13px;min-height:36px}.goal{font-size:12px;color:#52627c;text-align:center;margin:5px} </style></head><body><main><h1>Academic Promotion</h1><p>学术晋升 · 相同等级碰撞合成更高等级</p><div class="stats"><div>分数<b id="score">0</b></div><div>最高分<b id="best">0</b></div><div>下一等级<b id="next">本科生</b></div></div><div class="modebar" id="modebar"></div><div class="goal" id="goal"></div><div class="goal" id="challenge"></div><div class="reward" id="reward" aria-live="polite">选择难度，合成目标等级并达到目标积分可领取奖励。</div><canvas id="game" width="440" height="496"></canvas><div class="controls"><span id="status">移动手指选择位置，点击投放</span><button id="power" disabled>清除低级球 ×0</button><button id="restart">重新开始</button></div><div class="legend" id="legend"></div></main><script>
(()=>{const names=["本科生","硕士生","博士生","博士后","讲师","副教授","教授","优青","杰青","长江学者","院士"],colors=["#83c5f7","#65b8de","#66c4b2","#88bd7b","#d6b658","#e9a65d","#e68c69","#dc7796","#b47fc9","#867fc9","#d5a842"],symbols=["书","研","博","科","讲","副","教","优","杰","长","院"],radii=[24,29,34,40,46,53,60,68,77,87,98],W=440,H=496,canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),nextEl=document.getElementById("next"),status=document.getElementById("status");document.getElementById("legend").innerHTML=names.map((n,i)=>'<span>'+symbols[i]+' · '+n+'</span>').join('');const modes=[{name:"初级",width:440,weights:[25,30,25,20],time:5,target:5,points:40,dropSeconds:0,reward:"学术新星徽章"},{name:"普通",width:400,weights:[45,35,15,5],time:4,target:6,points:100,dropSeconds:20,reward:"青年学者徽章"},{name:"中级",width:360,weights:[65,30,5,0],time:3,target:7,points:180,dropSeconds:12,reward:"科研精英徽章"},{name:"高级",width:320,weights:[80,20,0,0],time:2,target:9,points:320,dropSeconds:8,reward:"学术领军徽章"},{name:"地狱",width:280,weights:[30,25,25,20],time:1,target:10,points:500,dropSeconds:5,reward:"院士之巅徽章"}];let modeIndex=1,highest=0,earned=false,overTime=0,awardTimer=0,drops=0,deadline=0,credits=0,stage=0;const milestones=[3,5,7,9,10],powerEl=document.getElementById("power"),challengeEl=document.getElementById("challenge");const goalEl=document.getElementById("goal"),rewardEl=document.getElementById("reward"),modebar=document.getElementById("modebar");let balls=[],score=0,best=Number(localStorage.getItem("academicPromotionBest")||0),next=0,aim=W/2,ended=false,last=0,lock=0;bestEl.textContent=best;const rnd=()=>{let p=Math.random()*100;const w=modes[modeIndex].weights;for(let i=0;i<w.length;i++){p-=w[i];if(p<0)return i}return 0};function bounds(){const half=modes[modeIndex].width/2;return [W/2-half,W/2+half]}function updateMode(){const m=modes[modeIndex];goalEl.textContent="目标："+names[m.target]+" ＋ "+m.points+"分｜"+(modeIndex===0?"不限时投放｜警戒线5秒失败":"容器宽"+m.width+"｜"+m.dropSeconds+"秒未操作自动投放｜警戒线"+m.time+"秒失败");modebar.innerHTML=modes.map((v,i)=>"<button data-mode=\""+i+"\" class=\""+(i===modeIndex?"active":"")+"\">"+v.name+"</button>").join("");rewardEl.textContent="本局奖励："+m.reward+"（同时达成等级与积分即可获得）";updateChallenge()}function updateChallenge(){const t=modeIndex>=3?milestones[Math.min(stage,milestones.length-1)]:modes[modeIndex].target;challengeEl.textContent=(modeIndex>=3?"晋升考核 "+(stage+1)+"/5：合成"+names[t]+"（按顺序）｜":"")+(modeIndex===0?"初级：全宽、无限制":"空间宽度 "+modes[modeIndex].width+"｜"+modes[modeIndex].dropSeconds+"秒自动投放");powerEl.textContent="清除低级球 ×"+credits;powerEl.disabled=credits<1||ended}modebar.addEventListener("click",e=>{const b=e.target.closest("button[data-mode]");if(!b)return;modeIndex=Number(b.dataset.mode);reset();updateMode()});updateMode();next=rnd();nextEl.textContent=names[next];function add(){if(ended||lock>0)return;const r=radii[next],[left,right]=bounds(),center=aim,x=Math.max(left+r+4,Math.min(right-r-4,center));balls.push({x,y:r+6,vx:0,vy:3,r,level:next,id:Math.random(),born:performance.now()});drops++;deadline=performance.now()+(modes[modeIndex].dropSeconds||1e12)*1000;next=rnd();nextEl.textContent=names[next];lock=.08}function reset(){balls=[];score=0;ended=false;lock=0;highest=0;earned=false;overTime=0;awardTimer=0;drops=0;stage=0;credits=0;deadline=performance.now()+(modes[modeIndex].dropSeconds||1e12)*1000;next=rnd();scoreEl.textContent=0;nextEl.textContent=names[next];status.textContent="移动手指选择位置，点击投放";updateChallenge();rewardEl.textContent="本局奖励："+modes[modeIndex].reward+"（同时达成等级与积分即可获得）"}document.getElementById("restart").onclick=reset;powerEl.onclick=()=>{if(credits<1||ended||!balls.length)return;const lv=Math.min(...balls.map(b=>b.level));const targets=balls.filter(b=>b.level===lv);if(!targets.length)return;targets.sort((a,b)=>a.y-b.y);balls.splice(balls.indexOf(targets[0]),1);credits--;updateChallenge()};function pointer(e){const box=canvas.getBoundingClientRect();aim=(e.clientX-box.left)*W/box.width}canvas.addEventListener("pointermove",pointer);canvas.addEventListener("pointerdown",e=>{pointer(e);add()});function merge(a,b){const lv=a.level;if(lv>=10)return false;const nr=radii[lv+1];a.x=Math.max(nr,Math.min(W-nr,(a.x+b.x)/2));a.y=Math.max(nr,Math.min(H-nr,(a.y+b.y)/2));a.level++;a.r=nr;highest=Math.max(highest,a.level);if(modeIndex>=3&&stage<milestones.length&&a.level>=milestones[stage]){stage++;credits++;rewardEl.textContent="晋升考核通过！获得一次清除低级球机会";updateChallenge()}else if(modeIndex<=2&&a.level>=modes[modeIndex].target&&credits===0){credits=1;updateChallenge()}a.vx=(a.vx+b.vx)*.2;a.vy=-2;balls.splice(balls.indexOf(b),1);score+=lv+2;scoreEl.textContent=score;if(!earned&&highest>=modes[modeIndex].target&&score>=modes[modeIndex].points&&(modeIndex<3||stage===5)){earned=true;const m=modes[modeIndex];rewardEl.textContent="恭喜！已获得「"+m.reward+"」！";try{localStorage.setItem("academicPromotionAward"+modeIndex,"1")}catch(e){}awardTimer=180}if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("academicPromotionBest",best)}return true}function physics(dt){const steps=3;for(let s=0;s<steps;s++){for(const b of balls){b.vy+=.65*dt;b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;b.vx*=.994;b.vy*=.999;const [left,right]=bounds();if(b.x<left+b.r){b.x=left+b.r;b.vx=Math.abs(b.vx)*.35}if(b.x>right-b.r){b.x=right-b.r;b.vx=-Math.abs(b.vx)*.35}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.2;b.vx*=.96}}let merged=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(dist>=min)continue;if(a.level===b.level&&merge(a,b)){merged=true;break outer}const nx=dx/dist,ny=dy/dist,overlap=min-dist,weight=a.r*a.r+b.r*b.r;a.x-=nx*overlap*b.r*b.r/weight;b.x+=nx*overlap*a.r*a.r/weight;a.y-=ny*overlap*b.r*b.r/weight;b.y+=ny*overlap*a.r*a.r/weight;const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){const impulse=-relative*.35;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}if(merged)continue}}function drawBall(b){const {x,y,r,level}=b;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=colors[level];ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle="#ffffff";ctx.stroke();ctx.beginPath();ctx.arc(x-r*.22,y-r*.26,r*.56,Math.PI,Math.PI*1.65);ctx.strokeStyle="#ffffff66";ctx.lineWidth=5;ctx.stroke();ctx.fillStyle="#20334c";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold "+Math.max(13,Math.min(27,r*.65))+"px sans-serif";ctx.fillText(symbols[level],x,y-r*.18);ctx.font="bold "+Math.max(9,Math.min(16,r*.34))+"px sans-serif";ctx.fillText(names[level],x,y+r*.42);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const [left,right]=bounds();ctx.fillStyle="#eaf0f9";ctx.fillRect(0,0,left,H);ctx.fillRect(right,0,W-right,H);ctx.strokeStyle="#91a6c2";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left,0);ctx.lineTo(left,H);ctx.moveTo(right,0);ctx.lineTo(right,H);ctx.stroke();ctx.strokeStyle="#c36c6c";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(0,95);ctx.lineTo(W,95);ctx.stroke();ctx.setLineDash([]);for(const b of balls)drawBall(b);if(!ended){ctx.globalAlpha=.6;drawBall({x:Math.max(left+radii[next],Math.min(right-radii[next],aim)),y:radii[next]+5,r:radii[next],level:next});ctx.globalAlpha=1}if(!ended&&modes[modeIndex].dropSeconds>0){ctx.textAlign="center";ctx.fillStyle="#9a3340";ctx.font="bold 15px sans-serif";ctx.fillText("自动投放倒计时 "+Math.max(0,Math.ceil((deadline-performance.now())/1000))+"秒",W/2,115)}if(ended){ctx.fillStyle="#1e2a42cc";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="white";ctx.font="bold 35px sans-serif";ctx.fillText("游戏结束",W/2,H/2);ctx.font="20px sans-serif";ctx.fillText("最终得分 "+score,W/2,H/2+42)}}function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;if(lock>0)lock-=dt/60;if(!ended){physics(dt);if(modes[modeIndex].dropSeconds>0&&t>=deadline&&lock<=0){add();status.textContent="超时已自动投放，可继续选择落点"}const occupied=balls.some(b=>b.y-b.r<95&&b.y>125&&Math.abs(b.vy)<2);overTime=occupied?overTime+Math.min((t-(loop.previous||t))/1000,.05):0;if(overTime>=modes[modeIndex].time){ended=true;status.textContent="挑战结束，点击重新开始"}powerEl.disabled=credits<1||ended}loop.previous=t;if(awardTimer>0)awardTimer-=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
